name: Tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/tests.yml@5be3a8de34658b5d09d8d04986c0576eb872c0f9 # pin!
    with:
      php-version: '8.5'
