name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest

      - name: Static analysis (phpstan, non-blocking)
        # phpstan runs against a baseline of pre-existing errors. The remaining
        # ~27 errors are contract violations in Processing/Processors/* that
        # predate this CI step — tracked for a dedicated fix. continue-on-error
        # keeps CI green while surfacing new regressions in the log.
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-interaction

      - name: Highload audit (tgbm:audit --strict)
        run: php artisan tgbm:audit --strict

      - name: Skills sync check
        run: bash scripts/sync-skills --check
