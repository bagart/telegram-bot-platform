name: Security

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
  schedule:
    # Weekly dependency/secret sweep — cheap, no container builds (cost guard).
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  security:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/security.yml@d965df4f74219279aa891c16da8a1725003e91ac # pin!
    permissions:
      contents: read
      security-events: write # SARIF upload when export-sarif is enabled
    with:
      php-version: '8.5'
      export-sarif: true
