name: Security

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
  schedule:
    # Weekly dependency/secret sweep — cheap, no container builds (cost guard).
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/security.yml@c13903f617e858d6fe4f724cd9650d49e37e5226 # pin!
    permissions:
      contents: read
      security-events: write # SARIF upload when export-sarif is enabled
    with:
      php-version: '8.5'
      export-sarif: true
