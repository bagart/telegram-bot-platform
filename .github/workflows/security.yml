name: security

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
  schedule:
    # Weekly dependency/secret sweep — cheap, no container builds (cost guard).
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Scanner version pinning (03 §53–§55). Bump quarterly after review.
  SEMGREP_VERSION: '1.86.0'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Composer audit
        run: composer audit --no-dev

      - name: SAST (Semgrep, report mode — enforce after tuning, 11 §47)
        continue-on-error: true
        run: |
          pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep --version
          tools/baseline/semgrep-scan.sh

      # Findings ingestion (03 §53): SARIF produced without --error so every
      # result lands in the report; the enforcing gate is the step above.
      - name: SAST SARIF export (push builds only)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --metrics=off \
            --config tools/baseline/semgrep-rules.yml \
            --exclude '*/src/TgApi/*' --exclude vendor --exclude node_modules \
            --sarif --output semgrep.sarif app tests misc/BAGArt/*/src || true
          jq -n --arg sha "${{ github.sha }}" --arg ref "${{ github.ref }}" \
                --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --slurpfile s semgrep.sarif \
                '{commit_sha:$sha, ref:$ref, checkout_uri:"file://"+(env.PWD // ""), started_at:$now, sarif:$s[0]}' \
                > sarif-payload.json
          gh api --method POST "repos/${{ github.repository }}/code-scanning/sarifs" \
            --input sarif-payload.json >/dev/null && echo "SARIF uploaded" \
            || echo "SARIF upload skipped (code scanning unavailable)"

      - name: Secret scan (built-in baseline scanner)
        run: php tools/baseline/secret-scan.php --all

      - name: Image tag policy (03 §38)
        run: bash tools/baseline/image-policy.sh

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by Git"
            exit 1
          fi
