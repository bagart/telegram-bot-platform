name: Security

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
  schedule:
    # Weekly dependency/secret sweep — cheap, no container builds (cost guard).
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  security:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/security.yml@d846c25539617e8fd9b24355f19a326951bc895e # pin!
    permissions:
      contents: read
      security-events: write # SARIF upload when export-sarif is enabled
    with:
      php-version: '8.5'
      export-sarif: true
