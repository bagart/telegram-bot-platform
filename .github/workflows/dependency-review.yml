name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/dependency-review.yml@a22dacbbb356048cc05a1428848084acc1d7d2f0 # pin!
