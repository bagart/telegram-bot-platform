name: Docker

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docker/**'
      - 'Dockerfile*'
      - 'docker-compose*'

permissions:
  contents: read

jobs:
  docker:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/docker.yml@36856d23c1100f2f6f5ca207ecf018662c57fb1e # pin!
    permissions:
      contents: read
      packages: write # image push on main/master/tags
    with:
      php-version: '8.5'
      push-image: ${{ github.event_name == 'push' }}
