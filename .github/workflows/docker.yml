name: Docker

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docker/**'
      - 'Dockerfile*'
      - 'docker-compose*'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    uses: BAGArt/telegram-platform-workflows/.github/workflows/docker.yml@ef135f0b4502b5d075968e046c1534e3a8bf6fc7 # pin!
    permissions:
      contents: read
      packages: write # image push on main/master/tags
    with:
      php-version: '8.5'
      push-image: ${{ github.event_name == 'push' }}
