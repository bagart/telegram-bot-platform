name: nightly

on:
  schedule:
    # Nightly deep sweep (05-ci-cd-and-release.md §40): full suite + audits.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm i

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: npm run build

      # Full application suite including all BAGArt library suites.
      - name: Full test suite (app + libraries)
        run: vendor/bin/pest --compact

      - name: Frontend checks
        run: |
          npx prettier --check resources/
          npx tsc --noEmit

      - name: Dependency audits (composer + npm, all deps)
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Secret scan (full git history via gitleaks)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

      - name: Secret scan (working tree, built-in baseline scanner)
        run: php tools/baseline/secret-scan.php --all

      - name: Baseline tooling self-check
        run: |
          php tools/baseline/yaml-lint.php
          bash tools/baseline/shell-lint.sh

  mutation:
    # Mutation testing for the async kernel core (04-qa-and-testing.md §14).
    # Report-only until MSI baselines stabilize; dependency is installed
    # CI-locally so the repository composer.json stays untouched.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2, pcov

      - name: Install platform dependencies (for autoloading)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Infection (CI-local)
        working-directory: misc/BAGArt/php-async-kernel-lib
        run: composer require --dev --no-interaction --no-progress infection/infection

      - name: Run mutation testing (report-only)
        working-directory: misc/BAGArt/php-async-kernel-lib
        run: |
          if [ -f infection.json5 ] || [ -f infection.json ]; then
            vendor/bin/infection --threads=2 --show-mutations --only-covered
          else
            vendor/bin/infection --threads=2 --show-mutations --only-covered --coverage=phpunit
          fi
