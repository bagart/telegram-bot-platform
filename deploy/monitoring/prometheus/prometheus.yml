global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/tg-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # The Laravel app exposes authenticated /health/metrics. Scraping it
  # directly needs a bearer-injecting proxy; until then app series arrive
  # through the node-exporter textfile collector (export-app-metrics.sh
  # pushes cmd/ops/metrics output on a schedule). See deploy/monitoring/README.md.
  - job_name: app-textfile
    static_configs:
      - targets: ['node-exporter:9100']
