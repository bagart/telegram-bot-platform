services:
  caddy:
    image: caddy:alpine
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/sites:/etc/caddy/sites:ro
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www

    tmpfs:
      - /tmp

    shm_size: 1gb

    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_started


  workspace:
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    ports:
      - "${VITE_PORT:-5173}:5173"

    tty: true
    stdin_open: true

    env_file:
      - .env
    volumes:
      - ./:/var/www
    networks:
      - laravel-development

  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: tg_bot_manager
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret

    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    networks:
      - laravel-development

  redis:
    image: redis:alpine
    networks:
      - laravel-development

  swagger:
    image: swaggerapi/swagger-ui
    expose:
      - "8080"

    volumes:
      - ./storage/api-docs:/swagger-ui/static
    environment:
      SWAGGER_JSON: /swagger-ui/static/openapi.yaml

    networks:
      - laravel-development

  xhprof-inbox:
    build:
      context: ./docker/xhprof-inbox
      dockerfile: Dockerfile
    expose:
      - "80"
    volumes:
      - ./storage/app/tmp/xhprof:/var/www/xhprof-inbox/storage:ro
    networks:
      - laravel-development

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    profiles:
      - ai
    environment:
      DATA_DIR: /app/data
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:-}
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD:-}
    volumes:
      - omniroute-data:/app/data
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
      - "${OMNIROUTE_API_PORT:-20129}:20129"
    networks:
      - laravel-development

networks:
  laravel-development:

volumes:
  postgres-data-development:
  omniroute-data:
