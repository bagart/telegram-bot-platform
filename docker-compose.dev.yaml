services:
  caddy:
    image: caddy:alpine
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/sites:/etc/caddy/sites:ro
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-false}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    env_file:
      - .env
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www

    tmpfs:
      - /tmp

    shm_size: 1gb

    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_started


  workspace:
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    ports:
      - "${VITE_PORT:-5173}:5173"

    tty: true
    stdin_open: true

    env_file:
      - .env
    volumes:
      - ./:/var/www
    networks:
      - laravel-development

  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: tg_bot_manager
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret

    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    networks:
      - laravel-development

  redis:
    image: redis:alpine
    networks:
      - laravel-development

  swagger:
    image: swaggerapi/swagger-ui
    expose:
      - "8080"

    volumes:
      - ./storage/api-docs:/swagger-ui/static
    environment:
      SWAGGER_JSON: /swagger-ui/static/openapi.yaml

    networks:
      - laravel-development

  xhprof-inbox:
    build:
      context: ./docker/xhprof-inbox
      dockerfile: Dockerfile
    expose:
      - "80"
    volumes:
      - ./storage/app/tmp/xhprof:/var/www/xhprof-inbox/storage:ro
    networks:
      - laravel-development

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    profiles:
      - ai
    environment:
      DATA_DIR: /app/data
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:-}
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD:-}
    volumes:
      - omniroute-data:/app/data
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
      - "${OMNIROUTE_API_PORT:-20129}:20129"
    networks:
      - laravel-development

  whisper:
    # Opt-in Local Whisper (OpenAI-compatible STT). Never pulled or started
    # unless the 'stt' profile is activated: cmd/docker/up stt requires
    # STT_WHISPER_ENABLED=true in .env.
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    profiles:
      - stt
    environment:
      ENABLE_UI: "false"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      # Current speaches images ignore PRELOAD_MODELS; weights are downloaded
      # once via POST /v1/models/{model_id} (see docs/docker/README.md).
      PRELOAD_MODELS: '["${STT_WHISPER_MODEL:-Systran/faster-whisper-small}"]'
      API_KEY: "${STT_WHISPER_API_KEY:-}"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "${STT_WHISPER_PORT:-8000}:8000"
    networks:
      - laravel-development
    healthcheck:
      # The header is required because current speaches images answer 403 on
      # every endpoint (health included) when API_KEY is set.
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${STT_WHISPER_API_KEY}", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

networks:
  laravel-development:

volumes:
  postgres-data-development:
  omniroute-data:
  whisper-models:
